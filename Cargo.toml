[package]
name = "RustyShell"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "RustyShell_shellcode"
path = "src/shellcode.rs"
required-features = ["shellcode"]

[[bin]]
name = "RustyShell_shellcode_debug"
path = "src/shellcode.rs"
required-features = ["shellcode", "debug"]

[[bin]]
name = "RustyShell_debug_no_shellcode"
path = "src/debug-no-shellcode.rs"
required-features = ["debug"]

[dependencies]
widestring = { version = "1.2.1", default-features = false }
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32",
    "Win32_System",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Kernel",
    "Win32_System_WindowsProgramming"
] }
windows-link = { version = "0.100" }

[build-dependencies]
windows-bindgen = { version = "0.100" }

[features]
shellcode = []
debug = []