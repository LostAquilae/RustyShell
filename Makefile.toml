[env]
CODEGEN_ARGS = "-Z unstable-options -C panic=immediate-abort -C link-arg=-nostdlib -C link-arg=-Wl,-T./Linker.ld,-s -C codegen-units=256"
NIGHTLY_ARGS = "-Z build-std=core,panic_abort,compiler_builtins -Z build-std-features=compiler-builtins-mem"


[tasks.windows_gnu_shellcode]
description = "Cross compiling using gnu target"
script = [
    "cargo +nightly build --target x86_64-pc-windows-gnu --bin RustyShell_shellcode --features shellcode --release ${NIGHTLY_ARGS}",
    "objcopy -O binary --only-section=.text ./target/x86_64-pc-windows-gnu/release/RustyShell_shellcode.exe ./target/x86_64-pc-windows-gnu/release/RustyShell_shellcode.bin"
]
env = { "RUSTFLAGS" = "${CODEGEN_ARGS}"}

[tasks.windows_gnu_debug_no_shellcode]
description = "Cross compiling using gnu target"
script = [
    "cargo +nightly build --target x86_64-pc-windows-gnu --bin RustyShell_debug_no_shellcode --release"
]